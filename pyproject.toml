[project]
name = "holobench"
version = "1.117.0"

authors = [{ name = "Austin Gregg-Smith", email = "blooop@gmail.com" }]
description = "A package for benchmarking the performance of arbitrary functions"
readme = "README.md"
license = "MIT"

requires-python = ">=3.11,<3.14"

dependencies = [
    "holoviews>=1.15,<=1.23.1",
    "numpy>=1.0,<=2.5.1",
    "param>=2.0,<=2.4.1",
    "hvplot>=0.12.0,<=0.12.2",
    "panel>=1.9.0,<=1.9.3",
    "diskcache>=5.6,<=5.6.3",
    "optuna>=3.2,<=4.9.0",
    "xarray>=2023.7,<=2026.7.0",
    "plotly>=5.15,<=6.9.0",
    "pandas>=2.0,<=3.0.5",
    "strenum>=0.4.0,<=0.4.15",
    "scikit-learn>=1.2,<=1.9.0",
    "moviepy>=2.1.2,<=2.2.1",
    "matplotlib>=3.7,<=3.11.1",
    "jinja2>=3.0,<=3.1.6",
]

[project.urls]
Repository = "https://github.com/blooop/bencher"
Home = "https://github.com/blooop/bencher"
Documentation = "https://bencher.readthedocs.io/en/latest/"

[project.scripts]
bencher = "bencher.render:main"

[tool.pixi.workspace]
channels = ["conda-forge", "https://prefix.dev/blooop"]
platforms = ["linux-64"]

[tool.pixi.system-requirements]
libc = "2.31"

[tool.pixi.dependencies]
python = ">=3.11"
sqlite = "==3.48.0"
shellcheck = ">=0.10.0,<0.11"
devpod = ">=0.8.0,<0.9"
gh = ">=2.83.0,<3.0"
playwright = ">=1.50,<2"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.pypi-dependencies]
holobench = { path = ".", editable = true }

[project.optional-dependencies]
test = [
    "nbformat",
    "nbclient>=0.7,<=0.11.0",
    "ipykernel",
    "pip",
    "jupyter_bokeh",
    "pylint>=3.2.5,<=4.0.6",
    "pytest-cov>=4.1,<=7.1.0",
    "pytest>=7.4,<=9.1.1",
    "hypothesis>=6.104.2,<=6.163.0",
    "ruff>=0.5.0,<=0.16.0",
    "sphinxcontrib-mermaid>=1.0,<3.0",
    "coverage>=7.5.4,<=7.15.2",
    "prek>=0.2.28,<0.5.0",
    "ty>=0.0.13,<=0.0.65",
]

docs = [
    "sphinx>=7.0,<=9.1.0",
    "myst-parser",
    "sphinxcontrib-napoleon",
    "sphinx-rtd-theme",
    "sphinx-autoapi",
    "sphinx-copybutton",
    "playwright",
    "Pillow",
]

#adds support for embedding rerun windows (alpha)
rerun = ["rerun-sdk>=0.32.0,<=0.35.0", "rerun-notebook>=0.32.0,<=0.35.0"]

#unused for the moment but may turn on later
# scoop = ["scoop>=0.7.0,<=0.7.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["bencher", "CHANGELOG.md"]

# Environments
[tool.pixi.environments]
default = { features = ["test", "rerun"], solve-group = "default" }
docs = { features = ["test", "rerun", "docs"], solve-group = "default" }
py311 = ["py311", "test", "rerun"]
py312 = ["py312", "test", "rerun"]
py313 = ["py313", "test", "rerun"]

[tool.pixi.tasks]
#AI AGENT TASKS

#use this task to test any changes to the code, it will run docs, lint, and tests. 
agent-iterate = { depends-on = [
    "generate-docs",
    "ci",
    "perf-track",
    "git-commit-all",
    "fix-commit-push",
] }


dev-add-docker = "devpod provider list | grep -qw docker || devpod provider add docker"
dev = { cmd = "devpod up . --ide none && ssh pythontemplate.devpod", depends-on = [
    "dev-add-docker",
] }
dev-vs = { cmd = "devpod up . --ide vscode", depends-on = ["dev-add-docker"] }
dev-restart = { cmd = "devpod up . --recreate --ide none && ssh pythontemplate.devpod", depends-on = [
    "dev-add-docker",
] }
dev-restart-vs = { cmd = "devpod up . --recreate --ide vscode", depends-on = [
    "dev-add-docker",
] }
prek = "prek run -a"
prek-install = "prek install"
prek-update = "prek autoupdate"
perf = "python bencher/example/example_self_benchmark.py"
perf-track = "python -c \"from bencher.example.example_self_benchmark import example_self_benchmark_over_time; example_self_benchmark_over_time()\""
format = "ruff format ."
check-clean-workspace = "git diff --exit-code"
ruff-lint = "ruff check . --fix"
pylint = "pylint --version && echo 'running pylint...' && pylint $(git ls-files '*.py')"
# --python $CONDA_PREFIX points ty at the *active* pixi environment, so `-e py311` and
# `-e py313` each type-check against their own interpreter and installed packages.
# Without it ty resolves no third-party import at all (param, panel, numpy, xarray all
# read as unresolved), which silently degrades every rule that depends on knowing a
# third-party type. See plans/23-constructive-data-modeling.md P1.
ty = { cmd = "ty check --respect-ignore-files --python \"$CONDA_PREFIX\" ." }
lint = { depends-on = ["ruff-lint", "ty", "pylint"] }
style = { depends-on = ["format", "lint"] }
commit-format = "git commit -a -m'autoformat code' || true"
test = "pytest"
# Re-run the whole suite with the collect/render split forced on: every auto_plot
# report build is routed through save_result -> load_result -> render so any
# pickle / render-from-loaded divergence surfaces in the existing assertions.
test-split = { cmd = "pytest", env = { BENCHER_FORCE_SPLIT_RENDER = "1" } }
coverage = "coverage run -m pytest && coverage xml -o coverage.xml"
coverage-report = "coverage report -m"
update-lock = "pixi update && git commit -a -m'update pixi.lock' || true"
push = "git push"
update-lock-push = { depends-on = ["update-lock", "push"] }
fix = { depends-on = ["update-lock", "format", "ruff-lint", "prek"] }
fix-commit-push = { depends-on = ["fix", "commit-format", "update-lock-push"] }
ci-no-cover = { depends-on = ["style", "test"] }
ci = { depends-on = [
    "format",
    "ruff-lint",
    "pylint",
    "ty",
    "generate-examples",
    "coverage",
    "coverage-report",
] }
git-commit-all = "git add -A && git commit -m 'Add all untracked files' || true"
ci-push = { depends-on = ["format", "ruff-lint", "update-lock", "ci", "push"] }
clear-pixi = "rm -rf .pixi pixi.lock"
ralph = "ralph"
update-from-template-repo = "./scripts/update_from_template.sh"
dev-use-prebuilt = "./scripts/devcontainer_use_prebuilt.sh"
dev-use-local = "./scripts/devcontainer_use_local.sh"

# Generate Python example files only (fast, no computation)
generate-examples = "python -c \"from bencher.example.meta.generate_examples import generate_python_files; generate_python_files()\""
# Generate + run + produce docs (HTML reports + RST)
generate-docs = "python bencher/example/meta/generate_examples.py"
docs = { cmd = "rm -rf docs/builtdocs; sphinx-build -b html docs docs/builtdocs", depends-on = [
    "generate-docs",
] }
# Quick docs rebuild (skip example generation) + local server for debugging
docs-quick = "rm -rf docs/builtdocs && python -m sphinx -b html docs docs/builtdocs"
docs-serve = { cmd = "python -m http.server 8000 -d docs/builtdocs", depends-on = ["docs-quick"] }
# Regenerate only the representative examples used by the scrollbar checks (fast)
docs-subset = "python bencher/example/meta/generate_examples.py --only example_sweep_1_float_0_cat_no_repeats,example_stats_repeats_comparison,example_sweep_0_float_0_cat_over_time,example_plot_heatmap,example_sweep_3_float_2_cat_with_repeats --skip-thumbnails"
# Verify built docs pages show a single scrollbar (requires docs/builtdocs)
docs-check = "pytest test/test_docs_scrollbars.py -v"
# NOTE: docs, docs-quick, docs-serve, docs-subset, and docs-check require the 'docs' environment:
#   pixi run -e docs docs-serve


#cache management
cache-stats = "python -c 'from bencher.cache_management import print_cache_stats; print_cache_stats()'"
cache-clear = "python -c 'from bencher.cache_management import clear_all; clear_all()'"
cache-clear-media = "python -c 'from bencher.cache_management import clear_media; clear_media()'"
cache-clean-orphans = "python -c 'from bencher.cache_management import clean_orphaned_media; clean_orphaned_media(dry_run=False)'"
# Reachability GC for the content-addressed blob store. Report first (blobs are
# primary storage, so a mistaken delete is data loss), then reclaim.
# The reclaim task passes a one-hour grace period. Blob mtime means "last
# referenced" (a dedup content hit refreshes it), so the grace period protects
# blobs a concurrent sweep wrote OR deduplicated onto within the window — sound
# as long as no sweep runs longer than an hour between materializing a payload
# and recording its reference. For longer sweeps, raise it or run GC between
# sessions.
cache-blob-orphans = "python -c 'from bencher.cache_management import print_orphaned_blobs; print_orphaned_blobs()'"
cache-blob-gc = "python -c 'from bencher.cache_management import print_orphaned_blobs; print_orphaned_blobs(dry_run=False, min_age_seconds=3600)'"

#demos
benchmark-save = "python scripts/benchmark_save.py"
demo = "python3 bencher/example/example_image.py"
demo_rerun = "python3 bencher/example/example_rerun.py"

#performance tracking
test-timing-xml = "pytest --junit-xml=test-results.xml"
test-timing-report = "python3 -m bencher.test_timing_report test-results.xml reports"
test-timing = { depends-on = ["test-timing-xml", "test-timing-report"] }


[tool.pylint]
extension-pkg-whitelist = ["numpy", "scipy"]
jobs = 16                                                  #detect number of cores
ignore-paths = ["docs/.*", "bencher/example/generated/.*"]

[tool.pylint.'MESSAGES CONTROL']
disable = "C,logging-fstring-interpolation,line-too-long,fixme,missing-module-docstring,too-many-instance-attributes,too-few-public-methods,too-many-arguments,too-many-locals,too-many-branches,too-many-statements,use-dict-literal,duplicate-code,too-many-public-methods,too-many-nested-blocks,cyclic-import,too-many-positional-arguments,too-many-ancestors"
enable = "no-else-return,consider-using-in"

[tool.coverage.run]
omit = ["*/test/*", "__init__.py"]

[tool.coverage.report]
fail_under = 85
exclude_also = [
    "def __repr__",
    "if False:",
    "if 0:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "(_):",
]

[tool.pytest.ini_options]
tmp_path_retention_count = 0

# Type-check gate. See plans/23-constructive-data-modeling.md D1 for the tier design.
#
# The rules below are grouped into tiers by measured cost, and the list is a RATCHET:
# rules move out of it over time and never back in. Two rules are exempt by design and
# stay forever (see "Permanently ignored").
#
# Tier A (enabled -- plan 23 P1): call-non-callable, call-top-callable, inconsistent-mro,
#   invalid-method-override, invalid-parameter-default, missing-argument,
#   too-many-positional-arguments, unresolved-import, unresolved-reference.
#   Deliberately absent from this file: they are errors everywhere except the paths
#   relaxed in [[tool.ty.overrides]] below.
#
# Tier B (~126 diagnostics, scheduled for plan 23 P12).
# Tier C (~1068 diagnostics, dominated by param-descriptor dynamism and by test/).
#   Enabled per-file via the strict override block below as modules are reworked;
#   every plan 23 phase adds the files it touches.
[tool.ty.rules]

# --- Tier B: enable globally in plan 23 P12 -----------------------------------------
# Return type mismatches. Also the signal a degraded assert_never falls back to, so
# enabling this hardens the exhaustiveness gate (plan 23 section 2.4).
invalid-return-type = "ignore"
# Union types read as non-iterable / no matching overload / unsupported operator.
not-iterable = "ignore"
no-matching-overload = "ignore"
unsupported-operator = "ignore"
# Possibly missing attributes (union type issues).
possibly-missing-attribute = "ignore"

# --- Tier C: param-descriptor dynamism; per-file via the strict block ---------------
# param descriptors: a class-level `x = param.Number(1.0)` reads back as float on
# instances, which no static checker models. bench_cfg.py alone accounts for 63.
invalid-assignment = "ignore"
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"
# pn.panel is a function used in annotation position, not a type.
invalid-type-form = "ignore"
not-subscriptable = "ignore"

# --- Permanently ignored: not debt, do not "fix" ------------------------------------
# The repo carries 8 `# type: ignore` comments for OTHER type checkers (mypy/pyright).
# ty considers them unused; that is expected and must stay silenced.
unused-ignore-comment = "ignore"
unused-type-ignore-comment = "ignore" # same rule, renamed in ty >= 0.0.14

# Optional imports, scoped to the exact files rather than whole trees. Neither can be
# annotated inline: ruff reflows the import past the line limit and the comment lands
# where pylint's own import-error pragma stops applying.
#   - playwright is optional tooling, needed only on the standalone screenshot path.
# (A third entry, the vestigial `setup.py` setuptools shim, was dropped when plan 03
# deleted that file along with setup.cfg and MANIFEST.in.)
[[tool.ty.overrides]]
include = [
    "bencher/example/meta/generate_examples.py",
    "test/test_docs_scrollbars.py",
]
[tool.ty.overrides.rules]
unresolved-import = "ignore"

# STRICT RATCHET. Files here are held to Tier C as well. Only ever append.
# Every plan 23 phase adds the modules it reworks as part of its Definition of Done;
# a file is added only once it is clean, so this block can never regress the gate.
[[tool.ty.overrides]]
include = [
    "bencher/sample_order.py",
    "bencher/sweep_timings.py",
    "bencher/blob_store.py",
    "bencher/variables/results.py",
    "bencher/history.py",
    "bencher/job.py",
    "bencher/worker_job.py",
    "bencher/result_collector.py",
    "bencher/worker_manager.py",
    "bencher/results/composable_container/composable_container_base.py",
    "bencher/results/composable_container/composable_container_panel.py",
    "bencher/results/composable_container/composable_container_dataframe.py",
    "bencher/results/composable_container/composable_container_rerun.py",
]
[tool.ty.overrides.rules]
invalid-assignment = "error"
invalid-argument-type = "error"
unresolved-attribute = "error"
invalid-type-form = "error"
not-subscriptable = "error"
