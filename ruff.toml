line-length = 100

[format]
# ruff 0.16 began formatting python code blocks embedded in markdown. The docs and
# plans are hand-aligned prose, so keep the formatter to real source files.
exclude = ["*.md"]

[lint]
ignore = [
    # E501 is not in ruff's default rule set, so this entry is inert today. It is kept
    # as a guard: the long strings it would flag are example `description=` prose and
    # embedded URLs that cannot be wrapped, so anyone widening `select` to cover E5
    # should decide about those 400-odd lines deliberately rather than by accident.
    "E501", # Line longer than `line-length` (100).
    # DTZ001/DTZ005: bencher's time axis is deliberately naive local wall-clock time.
    # The `over_time` dimension is stored as a numpy datetime64 xarray coordinate, which
    # has no timezone concept — passing tz-aware datetimes degrades the coordinate to
    # `object` dtype and breaks over_time slicing, sorting and plotting. Naive and aware
    # datetimes also cannot be compared, so a partial migration would be worse than none.
    "DTZ001", # `datetime.datetime()` without tzinfo.
    "DTZ005", # `datetime.datetime.now()` without tz.
]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Ignore `E402` (import violations) in all `__init__.py` files, and in `path/to/file.py`.
[lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
"**/{tests,docs,tools}/*" = ["E402"]
# RUF023: `__slots__` order is load-bearing here, not cosmetic. `_hash_slots` in this
# module hashes slot values in declaration order, so sorting __slots__ silently changes
# every BenchCfg.hash_persistent() value and strands all on-disk benchmark and over_time
# cache entries. The rule's autofix would do exactly that, so it is disabled for this
# file only — every other module is still checked. See the golden hash guard in
# test/test_hash_persistent.py.
"bencher/variables/results.py" = ["RUF023"]
